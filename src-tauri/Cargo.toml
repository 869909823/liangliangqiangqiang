[package]
name = "liangliangqiangqiang"
version = "0.1.0"
description = "三花猫桌面宠物踉踉跄跄"
authors = ["踉踉跄跄"]
edition = "2021"

[lib]
name = "liangliangqiangqiang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
