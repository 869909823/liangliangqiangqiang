<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>踉踉跄跄｜三花猫桌宠</title>
<style>
:root{--cream:#fff6df;--orange:#e99a45;--dark:#403238;--blue:#a9d8e5;--pink:#f4a6a8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fffaf0,#dff3f4);font-family:"Microsoft YaHei",sans-serif;color:var(--dark);display:grid;place-items:center}
.app{width:min(560px,92vw);padding:28px;text-align:center}.title{font-size:28px;font-weight:800;margin-bottom:4px}.sub{opacity:.68;margin-bottom:20px}
.stage{height:390px;border-radius:28px;background:rgba(255,255,255,.62);box-shadow:0 18px 50px #8bb3b533;display:grid;place-items:center;position:relative;overflow:hidden}
.pet{position:relative;width:250px;height:280px;cursor:pointer;animation:wobble 3.5s ease-in-out infinite;transition:.25s}.pet:hover{transform:scale(1.04)}
.ear{position:absolute;top:8px;width:70px;height:78px;background:var(--orange);border:6px solid var(--dark);border-radius:75% 20% 10% 20%;z-index:1}.ear.left{left:34px;transform:rotate(-24deg)}.ear.right{right:34px;transform:rotate(24deg) scaleX(-1)}.ear:after{content:"";position:absolute;inset:14px;background:var(--pink);border-radius:75% 20% 10% 20%}
.head{position:absolute;top:36px;left:25px;width:200px;height:170px;background:var(--cream);border:6px solid var(--dark);border-radius:48% 48% 45% 45%;z-index:2;overflow:hidden}.patch{position:absolute;background:var(--orange)}.patch.one{width:100px;height:100px;right:-15px;top:-18px;border-radius:50%}.patch.two{width:70px;height:90px;left:-20px;top:30px;background:var(--dark);border-radius:50%}.patch.three{width:70px;height:44px;right:20px;bottom:8px;background:var(--dark);border-radius:50%}
.eye{position:absolute;top:70px;width:17px;height:23px;background:var(--dark);border-radius:50%;z-index:3}.eye.left{left:52px}.eye.right{right:52px}.eye:after{content:"";position:absolute;top:4px;left:4px;width:5px;height:6px;background:white;border-radius:50%}.nose{position:absolute;left:93px;top:101px;width:14px;height:10px;background:var(--pink);border-radius:50%;z-index:3}.mouth{position:absolute;left:89px;top:111px;width:24px;height:15px;border-bottom:4px solid var(--dark);border-radius:50%;z-index:3}.stripe{position:absolute;top:55px;width:28px;height:6px;background:var(--orange);border-radius:6px;z-index:3}.stripe.s1{left:12px;transform:rotate(18deg)}.stripe.s2{right:12px;transform:rotate(-18deg)}
.body{position:absolute;left:60px;top:192px;width:130px;height:78px;background:var(--cream);border:6px solid var(--dark);border-radius:48% 48% 35% 35%;z-index:1}.chest{position:absolute;left:35px;top:8px;width:48px;height:52px;background:white;border-radius:50%}.scarf{position:absolute;left:52px;top:174px;width:145px;height:32px;background:var(--blue);border:5px solid var(--dark);border-radius:18px;z-index:4;transform:rotate(-3deg)}.fish{position:absolute;right:25px;top:197px;width:24px;height:15px;background:#83b9ca;border:3px solid var(--dark);border-radius:50%;z-index:5;transform:rotate(20deg)}.fish:after{content:"";position:absolute;right:-10px;top:1px;border-left:10px solid #83b9ca;border-top:5px solid transparent;border-bottom:5px solid transparent}
.paw{position:absolute;top:224px;width:42px;height:48px;background:var(--cream);border:6px solid var(--dark);border-radius:50%;z-index:4}.paw.left{left:50px;transform:rotate(15deg)}.paw.right{right:50px;transform:rotate(-15deg)}
.keyboard{position:absolute;left:65px;bottom:-8px;width:120px;height:25px;background:var(--dark);border-radius:7px;z-index:6}.keyboard:after{content:"⌨  ⌨  ⌨  ⌨";color:var(--blue);font-size:13px;letter-spacing:4px}
.bubble{position:absolute;right:25px;top:28px;background:white;padding:10px 14px;border-radius:18px;box-shadow:0 5px 15px #0001;font-size:14px;opacity:.9}.bubble:after{content:"";position:absolute;left:15px;bottom:-8px;border-top:10px solid white;border-right:10px solid transparent}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}.controls button{border:0;border-radius:999px;background:white;color:var(--dark);padding:9px 15px;cursor:pointer;box-shadow:0 3px 10px #0001}.controls button:hover{background:var(--blue)}.controls button.active{background:var(--blue);font-weight:700}.hint{font-size:12px;opacity:.55;margin-top:12px}
@keyframes wobble{0%,100%{transform:rotate(0)}45%{transform:rotate(-2deg) translateY(-2px)}55%{transform:rotate(2deg) translateY(1px)}}
.work .pet{animation:tap .55s ease-in-out infinite alternate}.work .keyboard{transform:translateY(-7px)}.think .bubble:before{content:"？"}.error .pet{animation:stumble .45s ease-in-out infinite alternate}.done .paw.right{top:205px;transform:rotate(-35deg)}.sleep .pet{animation:sleep 3s ease-in-out infinite}.sleep .bubble:before{content:"Zzz…"}
@keyframes tap{to{transform:translateY(3px)}}@keyframes stumble{to{transform:translateX(10px) rotate(8deg)}}@keyframes sleep{50%{transform:translateY(8px) rotate(3deg)}}
</style></head><body><main class="app"><div class="title">踉踉跄跄</div><div class="sub">一只努力跟上每个任务进度的三花猫</div><section class="stage" id="stage"><div class="bubble" id="bubble">我来试试——</div><div class="pet" id="pet"><div class="ear left"></div><div class="ear right"></div><div class="head"><i class="patch one"></i><i class="patch two"></i><i class="patch three"></i><i class="stripe s1"></i><i class="stripe s2"></i><i class="eye left"></i><i class="eye right"></i><i class="nose"></i><i class="mouth"></i></div><div class="scarf"></div><div class="body"><i class="chest"></i></div><div class="paw left"></div><div class="paw right"></div><div class="fish"></div><div class="keyboard"></div></div></section><nav class="controls"><button data-state="idle">待机</button><button data-state="work">工作</button><button data-state="think">思考</button><button data-state="error">出错</button><button data-state="done">完成</button><button data-state="sleep">睡觉</button><button id="auto">自动陪伴</button></nav><div class="hint">拖动猫咪可以和它玩；点击“自动陪伴”让它自己活动</div></main><script>
const stage=document.querySelector('#stage'),pet=document.querySelector('#pet'),bubble=document.querySelector('#bubble'),auto=document.querySelector('#auto');const texts={idle:'我来试试——',work:'认真工作中！',think:'让我想想…',error:'哎呀！先喝杯修复 bug 茶',done:'任务完成！差点摔倒～',sleep:'Zzz…'};let timer,drag=false,dx=0,dy=0;function setState(s){stage.className=s;bubble.textContent=texts[s];document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('active',b.dataset.state===s))}document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{clearInterval(timer);auto.classList.remove('active');setState(b.dataset.state)});auto.onclick=()=>{if(timer){clearInterval(timer);timer=null;auto.classList.remove('active');return}auto.classList.add('active');const states=['idle','think','work','idle','sleep','done'];let i=0;setState(states[i]);timer=setInterval(()=>setState(states[++i%states.length]),3500)});pet.onclick=()=>{if(!drag)bubble.textContent='慢一点也没关系。'};pet.onpointerdown=e=>{drag=true;pet.setPointerCapture(e.pointerId);const r=pet.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top};pet.onpointermove=e=>{if(!drag)return;const r=stage.getBoundingClientRect();pet.style.position='absolute';pet.style.left=Math.max(0,Math.min(r.width-250,e.clientX-r.left-dx))+'px';pet.style.top=Math.max(0,Math.min(r.height-280,e.clientY-r.top-dy))+'px'};pet.onpointerup=()=>{drag=false};
</script></body></html>
