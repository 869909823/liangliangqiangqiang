name: 发布 GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止未锁定依赖的正式发布
        shell: bash
        run: |
          if [[ ! -f src-tauri/Cargo.lock ]]; then
            echo '缺少 src-tauri/Cargo.lock。请先手动运行“构建 Windows”，下载 generated-cargo-lock 并提交。' >&2
            exit 1
          fi

  build:
    needs: preflight
    uses: ./.github/workflows/build-windows.yml

  android:
    needs: preflight
    uses: ./.github/workflows/build-android.yml

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 核对标签与应用版本
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "标签 $TAG 与应用版本 v$VERSION 不一致" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets
      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # release-assets 可能含子目录（如 Android universal/），只收集文件上传
          mapfile -t assets < <(find release-assets -type f | sort)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo 'release-assets 中没有文件' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          elif [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" "${assets[@]}" --title "踉踉跄跄 $TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" "${assets[@]}" --title "踉踉跄跄 $TAG" --generate-notes --latest
          fi
