name: 自动修复 Rust 格式

on:
  workflow_run:
    workflows: ['验证 V2']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || 'v2' }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 自动 cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all

      - name: 检测是否有变更
        id: diff
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ([string]::IsNullOrWhiteSpace($status)) {
            'changed=false' >> $env:GITHUB_OUTPUT
          } else {
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Host '发现需要提交的格式修复：'
            $status
          }

      - name: 提交修复
        if: steps.diff.outputs.changed == 'true'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: cargo fmt 自动修复'
          git push
