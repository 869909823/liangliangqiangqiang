name: 验证 V2

on:
  workflow_dispatch:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web 与 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 静态检查与单元测试
        run: npm run validate

  rust:
    name: Rust 格式与编译检查
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 准备 Cargo 锁文件
        shell: pwsh
        run: |
          if (!(Test-Path 'src-tauri/Cargo.lock')) {
            Write-Warning '仓库尚未提交 Cargo.lock，本次 CI 临时生成；正式发布前必须提交该文件。'
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          }
      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: 检查 Rust 编译
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
