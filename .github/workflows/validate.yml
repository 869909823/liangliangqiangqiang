name: 验证 V2

on:
  workflow_dispatch:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web 与 PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: 准备 npm 依赖
        run: npm install --no-audit --no-fund
      - name: 静态检查
        run: npm run check
      - name: 单元测试
        run: npm test

  rust:
    name: Rust 格式与编译检查
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: 准备 Cargo 锁文件
        shell: pwsh
        run: |
          if (!(Test-Path 'src-tauri/Cargo.lock')) {
            Write-Warning '仓库尚未提交 Cargo.lock，本次 CI 临时生成；正式发布前必须提交该文件。'
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          }
      - name: 检查并自动修复 Rust 格式
        shell: pwsh
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Rust 格式不达标，自动修复并提交（下次 validate 应通过）'
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style: cargo fmt 自动修复'
            git push
            exit 1
          }
      - name: 检查 Rust 编译
        shell: pwsh
        run: |
          $manifest = 'src-tauri/Cargo.toml'
          $locked = (Test-Path 'src-tauri/Cargo.lock')
          if ($locked) {
            cargo check --manifest-path $manifest --locked
          } else {
            Write-Warning '未检测到 Cargo.lock，使用 cargo check（不加 --locked）以兼容 v2 分支首次构建'
            cargo check --manifest-path $manifest
          }
