name: 发布手机版 PWA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 发布到 beta 子目录或正式根目录
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
  push:
    tags:
      - 'v0.2.*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 发布前验证
        run: npm run validate
      - name: 选择发布通道
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          channel="${INPUT_CHANNEL:-beta}"
          if [[ "$REF_TYPE" == "tag" ]]; then
            # 保留 V1 根路径：tag 触发时固定走 beta，绝不自动覆盖根路径
            channel="beta"
            echo "tag $REF_NAME 触发：固定 beta 通道，保留根路径 V1"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: 组装 Pages 文件
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$CHANNEL" == "stable" && "$version" == *-* ]]; then
            echo "预发布版本 $version 不能覆盖手机版正式根路径" >&2
            exit 1
          fi
          mkdir -p .pages
          if [[ "$CHANNEL" == "beta" ]]; then
            git rev-parse --verify v0.1.0
            mkdir -p .v1-source .pages/beta
            git archive v0.1.0 src | tar -x -C .v1-source
            cp -a .v1-source/src/. .pages/
            cp -a src/. .pages/beta/
          else
            cp -a src/. .pages/
          fi
          touch .pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
