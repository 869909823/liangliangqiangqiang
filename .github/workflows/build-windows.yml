name: 构建 Windows

on:
  workflow_call:
    outputs:
      version:
        description: 构建的应用版本
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: 读取版本
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: 准备 Cargo 锁文件
        id: cargo_lock
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/Cargo.lock') {
            'generated=false' >> $env:GITHUB_OUTPUT
          } else {
            cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
            'generated=true' >> $env:GITHUB_OUTPUT
            Write-Warning '已生成 Cargo.lock；下载 generated-cargo-lock Artifact 并提交后才能发布 Release。'
          }
      - name: 验证源码
        run: npm run validate
      - name: 安装云端构建依赖
        run: npm install --no-audit --no-fund
      - name: 构建 NSIS 安装包
        run: npm run tauri build
      - name: 生成 SHA-256 校验文件
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installers = Get-ChildItem $bundle -Filter *.exe
          if ($installers.Count -eq 0) { throw '没有找到 NSIS 安装包' }
          $lines = $installers | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content "$bundle/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: 上传首次生成的依赖锁
        if: steps.cargo_lock.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: generated-cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 14
